<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0e1a2b;
    color: #fff;
    position: relative;
    overflow: hidden;
    --c: {{COULEUR}};
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 620px at 92% 4%, color-mix(in srgb, var(--c) 55%, transparent), transparent 70%),
      radial-gradient(circle 520px at 0% 100%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%),
      #0e1a2b;
  }
  .ring {
    position: absolute; right: -260px; top: -300px; width: 600px; height: 600px;
    border-radius: 50%; border: 36px solid color-mix(in srgb, var(--c) 40%, transparent);
  }
  .wrap { position: relative; height: 100%; padding: 72px 72px 60px; display: flex; flex-direction: column; }
  .kicker { font-weight: 800; font-size: 24px; letter-spacing: 5px; text-transform: uppercase; color: var(--c); }
  .date {
    margin-top: 18px; display: inline-block; align-self: flex-start;
    background: #fff; color: #0e1a2b; font-weight: 800; font-size: 30px;
    padding: 8px 22px; letter-spacing: 2px; text-transform: uppercase;
  }
  h1 {
    margin-top: 44px; font-weight: 900; font-size: {{TAILLE}}px; line-height: 1.02;
    letter-spacing: -1px;
  }
  .org { margin-top: 18px; font-size: 26px; font-weight: 600; color: rgba(255,255,255,.65); }
  .accroche {
    margin-top: 40px; font-size: 40px; font-weight: 700; line-height: 1.25;
    border-left: 10px solid var(--c); padding-left: 28px;
  }
  .faits { margin-top: 44px; display: flex; flex-direction: column; gap: 20px; }
  .fait {
    display: flex; gap: 22px; align-items: flex-start;
    background: rgba(255,255,255,.07); border-radius: 18px; padding: 24px 28px;
    font-size: 29px; line-height: 1.32; font-weight: 500;
  }
  .fait b { color: var(--c); font-weight: 900; font-size: 34px; line-height: 1.1; min-width: 34px; }
  .spacer { flex: 1; }
  .autres { font-size: 24px; color: rgba(255,255,255,.75); line-height: 1.4; margin-bottom: 22px; }
  .autres span { color: var(--c); font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 20px; display: block; margin-bottom: 6px; }
  .pied {
    display: flex; flex-direction: column; gap: 8px;
    border-top: 2px solid rgba(255,255,255,.18); padding-top: 22px;
    font-size: 22px; color: rgba(255,255,255,.6);
  }
  .pied .cta { color: #fff; font-weight: 800; font-size: 26px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="ring"></div>
  <div class="wrap">
    <div class="kicker">Journée {{TYPE}} · une cause chaque jour</div>
    <div class="date">{{DATE}}</div>
    <h1>{{TITRE}}</h1>
    <div class="org">{{ORGANISME}}</div>
    <div class="accroche">{{ACCROCHE}}</div>
    <div class="faits">{{FAITS}}</div>
    <div class="spacer"></div>
    {{AUTRES}}
    <div class="pied">
      <div class="cta">Partagez pour faire connaître cette cause</div>
      <div>Source : {{SOURCE}}</div>
    </div>
  </div>
</body>
</html>
