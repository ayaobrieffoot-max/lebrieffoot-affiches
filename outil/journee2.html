<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: {{H}}px; }
  body {
    font-family: 'Inter', sans-serif; color: #12123a; overflow: hidden; position: relative;
    --c1: {{C1}}; --c2: {{C2}}; --ink: #12123a;
    background: linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
  }
  .dots { position: absolute; inset: 0; pointer-events: none; }
  .dots i { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); }
  .wrap { position: relative; height: 100%; padding: 64px 64px 56px; display: flex; flex-direction: column; }
  .brand {
    align-self: flex-start; background: var(--ink); color: #fff; border-radius: 999px;
    padding: 14px 30px; font-weight: 900; font-size: 26px; letter-spacing: 3px;
  }
  .brand b { color: var(--c1); }
  .head { display: flex; align-items: center; gap: 34px; margin-top: 40px; }
  .cal {
    background: #fff; border-radius: 28px; width: 220px; flex: none; text-align: center; overflow: hidden;
    box-shadow: 0 18px 0 rgba(18,18,58,.18); transform: rotate(-4deg);
  }
  .cal .m { background: var(--ink); color: #fff; font-weight: 900; font-size: 30px; letter-spacing: 4px; padding: 12px 0; }
  .cal .d { font-weight: 900; font-size: 130px; line-height: 1.05; padding: 6px 0 14px; }
  h1 { font-weight: 900; font-size: {{TAILLE}}px; line-height: .98; letter-spacing: -2px; text-transform: uppercase; }
  .illu { margin: 18px auto 0; width: 100%; display: flex; justify-content: center; }
  .illu svg { width: 680px; height: auto; }
  .tall .illu svg { width: 1000px; }
  .tall .hook .q { font-size: 54px; } .tall .hook .r { font-size: 36px; }
  .tall .stat .v { font-size: 84px; } .tall .stat .l { font-size: 30px; }
  .tall .msg { font-size: 48px; } .tall .wrap { padding-top: 90px; padding-bottom: 80px; }
  .tall .head { margin-top: 60px; } .tall .illu { margin-top: 60px; } .tall .hook { margin-top: 50px; } .tall .stats { margin-top: 36px; }
  .hook {
    margin-top: 10px; background: #fff; border-radius: 30px; padding: 34px 40px; position: relative;
    box-shadow: 0 16px 0 rgba(18,18,58,.18);
  }
  .hook .q { font-size: 42px; font-weight: 900; line-height: 1.15; }
  .hook .q em { font-style: normal; background: var(--c1); padding: 0 8px; border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .hook .r { margin-top: 14px; font-size: 30px; font-weight: 700; color: #4b4b6e; }
  .stats { display: flex; gap: 22px; margin-top: 26px; }
  .stat { flex: 1; background: var(--ink); color: #fff; border-radius: 26px; padding: 20px 26px; }
  .stat .v { font-size: 58px; font-weight: 900; line-height: 1; color: var(--c1); }
  .stat .l { margin-top: 10px; font-size: 25px; font-weight: 600; line-height: 1.25; }
  .spacer { flex: 1; min-height: 20px; }
  .msg { font-size: 34px; font-weight: 900; text-align: center; line-height: 1.2; }
  .pied { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 700; color: rgba(18,18,58,.75); }
  .pied .share { background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: 900; font-size: 24px; }
</style>
</head>
<body class="{{CLASSE}}">
  <div class="dots">{{DOTS}}</div>
  <div class="wrap">
    <div class="brand">CE QUE CE JOUR NOUS DIT, <b>AVEC AMM</b></div>
    <div class="head">
      <div class="cal"><div class="m">{{MOIS}}</div><div class="d">{{JOUR}}</div></div>
      <h1>{{TITRE}}</h1>
    </div>
    <div class="illu">{{ILLU}}</div>
    <div class="hook"><div class="q">{{QUESTION}}</div><div class="r">{{REPONSE}}</div></div>
    <div class="stats">{{STATS}}</div>
    <div class="spacer"></div>
    <div class="msg">{{MESSAGE}}</div>
    <div class="pied"><span class="share">Partagez !</span><span>Source : {{SOURCE}}</span></div>
  </div>
</body>
</html>
