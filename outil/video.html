<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: #04140c; color: #fff; position: relative; }
  .bg { position: absolute; inset: -120px; will-change: transform;
    background:
      radial-gradient(ellipse 900px 700px at 85% 0%, rgba(255,206,0,.30), transparent 60%),
      radial-gradient(ellipse 800px 800px at 0% 100%, rgba(210,16,52,.32), transparent 60%),
      repeating-linear-gradient(90deg, #06301a 0 135px, #052914 135px 270px); }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(4,20,12,.25) 0%, rgba(4,20,12,.70) 45%, rgba(4,20,12,.90) 100%); }
  .stripes { position: absolute; top: 0; right: 0; width: 520px; height: 520px; overflow: hidden; }
  .stripes span { position: absolute; width: 900px; height: 44px; left: -80px; transform: rotate(45deg); }
  .stripes span:nth-child(1) { top: 150px; background: #ffce00; }
  .stripes span:nth-child(2) { top: 214px; background: #006a4e; }
  .stripes span:nth-child(3) { top: 278px; background: #d21034; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .brand { position: absolute; top: 90px; left: 70px; font-family: 'Anton'; font-size: 46px; letter-spacing: 2px; }
  .brand b { color: #ffce00; font-weight: 400; }
  .anton { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; }

  /* intro */
  #intro .kick { position: absolute; top: 560px; left: 80px; font-weight: 800; font-size: 40px; letter-spacing: 9px; color: #ffce00; }
  #intro .big { position: absolute; top: 640px; left: 72px; font-size: 230px; line-height: .92; }
  #intro .big .y { color: #ffce00; }
  #intro .amm { position: absolute; top: 1110px; left: 80px; background: #fff; color: #04140c; padding: 10px 26px; font-size: 92px; }
  #intro .date { position: absolute; top: 1290px; left: 80px; font-weight: 700; font-size: 46px; letter-spacing: 5px; text-transform: uppercase; color: #dfe9e3; }
  #intro .hook { position: absolute; top: 1520px; left: 80px; right: 80px; background: #ffce00; color: #04140c; border-radius: 26px; padding: 30px 40px; font-weight: 800; font-size: 50px; }

  /* info */
  .info .counter { position: absolute; top: 200px; left: 70px; font-weight: 800; font-size: 34px; letter-spacing: 6px; color: #b9cdbf; }
  .info .num { position: absolute; top: 300px; left: 70px; width: 300px; height: 300px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 230px; color: #04140c; }
  .info .tag { position: absolute; top: 680px; left: 70px; font-weight: 800; font-size: 44px; letter-spacing: 7px; color: #ffce00; text-transform: uppercase; }
  .info .title { position: absolute; top: 760px; left: 70px; right: 70px; font-size: 128px; line-height: 1.0; }
  .info .detail { position: absolute; left: 70px; right: 70px; font-size: 52px; line-height: 1.3; font-weight: 500; color: #e8f0eb; }
  .info .react { position: absolute; left: 70px; max-width: 940px; background: #ffce00; color: #04140c; border-radius: 999px; padding: 26px 44px; font-weight: 800; font-size: 50px; }
  .info .src { position: absolute; bottom: 240px; left: 70px; font-size: 32px; color: #9fb5a7; }
  .info .bar { position: absolute; bottom: 160px; left: 70px; right: 70px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.15); overflow: hidden; }
  .info .bar i { display: block; height: 100%; background: #ffce00; width: 0; }

  /* outro */
  #outro .head { position: absolute; top: 200px; left: 70px; right: 70px; font-size: 86px; line-height: 1; text-align: center; }
  #outro .head .y { color: #ffce00; }
  #outro .poster { position: absolute; top: 330px; left: 60px; width: 960px; border-radius: 28px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  #outro .cta { position: absolute; top: 1590px; left: 70px; right: 70px; text-align: center; font-weight: 800; font-size: 50px; line-height: 1.3; }
  #outro .cta .pill { display: inline-block; margin-top: 22px; font-size: 42px; white-space: nowrap; background: #ffce00; color: #04140c; border-radius: 999px; padding: 18px 44px; }
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="stripes"><span></span><span></span><span></span></div>

<div class="scene" id="intro">
  <div class="kick">● LES 5 INFOS FOOT DU JOUR</div>
  <div class="big anton"><span id="w1">LE BRIEF</span><br><span class="y" id="w2">FOOT</span></div>
  <div class="amm anton">D'AMM</div>
  <div class="date">{{DATE}}</div>
  <div class="hook">Reste jusqu'au bout : le récap complet t'attend à la fin 👀</div>
</div>

{{INFOS}}

<div class="scene" id="outro">
  <div class="brand">LE BRIEF <b>FOOT</b> D'AMM</div>
  <div class="head anton">LE <span class="y">RÉCAP</span> DU JOUR</div>
  <img class="poster" src="{{POSTER}}">
  <div class="cta">Laquelle t'a fait le plus réagir ?<br><span class="pill">Commente le numéro 👇 · Abonne-toi ⚽</span></div>
</div>

<script>
const T = {{TIMING}};  // {intro, info, outro}
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function show(el, p, dx = 0, dy = 60, scale = false) {
  if (!el) return;
  el.style.opacity = clamp(p * 1.4);
  const s = scale ? (0.4 + 0.6 * back(p)) : 1;
  el.style.transform = `translate(${dx * (1 - ease(p))}px, ${dy * (1 - ease(p))}px) scale(${s})`;
}
// P : progression d'une animation prévue pour le format long (15 s / info), mise à l'échelle par f
const P = (l, start, dur, f) => (l - start * f) / Math.max(0.22, dur * f);
function sceneAlpha(el, local, dur) {
  const fd = Math.min(0.35, dur * 0.07);
  const a = Math.min(clamp(local / fd), clamp((dur - local) / fd));
  el.style.opacity = a;
  return a;
}
window.render = function (t) {
  document.getElementById('bg').style.transform = `translate(${Math.sin(t / 7) * 40}px, ${Math.cos(t / 9) * 40}px) scale(1.05)`;
  document.querySelectorAll('.scene').forEach(s => s.style.opacity = 0);
  // intro
  if (t < T.intro) {
    const el = document.getElementById('intro'); const l = t; const f = T.intro / 6;
    sceneAlpha(el, l, T.intro);
    show(el.querySelector('.kick'), P(l, 0, 0.5, f), -80, 0);
    show(document.getElementById('w1'), P(l, 0.2, 0.5, f), 0, 0, true);
    show(document.getElementById('w2'), P(l, 0.6, 0.5, f), 0, 0, true);
    document.getElementById('w1').style.display = document.getElementById('w2').style.display = 'inline-block';
    show(el.querySelector('.amm'), P(l, 1.0, 0.5, f), -200, 0);
    show(el.querySelector('.date'), P(l, 1.3, 0.6, f));
    show(el.querySelector('.hook'), P(l, 2.2, 0.6, f), 0, 120, true);
    return;
  }
  let u = t - T.intro;
  const infos = document.querySelectorAll('.info');
  const k = Math.floor(u / T.info);
  if (k < infos.length) {
    const el = infos[k]; const l = u - k * T.info; const f = T.info / 15;
    sceneAlpha(el, l, T.info);
    show(el.querySelector('.counter'), P(l, 0, 0.5, f), -80, 0);
    show(el.querySelector('.num'), P(l, 0.1, 0.6, f), 0, 0, true);
    show(el.querySelector('.tag'), P(l, 0.6, 0.5, f), -100, 0);
    el.querySelectorAll('.title .w').forEach((w, i) => show(w, P(l, 0.9 + i * 0.12, 0.45, f), 0, 80));
    show(el.querySelector('.detail'), P(l, 2.6, 0.7, f));
    show(el.querySelector('.react'), P(l, 5.0, 0.6, f), 0, 0, true);
    show(el.querySelector('.src'), P(l, 6.0, 0.6, f));
    el.querySelector('.bar i').style.width = (clamp(l / T.info) * 100) + '%';
    el.querySelector('.num').style.transform += ` rotate(${Math.sin(l * 2) * 2}deg)`;
    return;
  }
  u -= infos.length * T.info;
  const el = document.getElementById('outro');
  sceneAlpha(el, u, T.outro + 0.35);
  const f = T.outro / 12;
  show(el.querySelector('.head'), P(u, 0, 0.6, f), 0, -80, true);
  const p = el.querySelector('.poster');
  p.style.opacity = clamp(P(u, 0.4, 0.6, f));
  p.style.transform = `scale(${0.92 + 0.08 * ease(P(u, 0.4, 1.2, f)) + u * 0.004 / f})`;
  show(el.querySelector('.cta'), P(u, 1.5, 0.6, f), 0, 80);
};
window.layout = function () {
  // place détail / réaction sous le titre selon sa hauteur réelle
  document.querySelectorAll('.info').forEach(el => {
    const ti = el.querySelector('.title');
    const bottom = ti.offsetTop + ti.offsetHeight;
    const d = el.querySelector('.detail'); d.style.top = (bottom + 50) + 'px';
    el.querySelector('.react').style.top = (d.offsetTop + d.offsetHeight + 60) + 'px';
  });
};
</script>
</body>
</html>
